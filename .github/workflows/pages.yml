name: DRE no GitHub Pages

# TRANSICAO: publica da branch migracao-supabase -- a main ainda e o Netlify de
# producao. Na virada, o gatilho passa para a main e o Netlify morre.
on:
  push:
    branches: [migracao-supabase]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Separar os arquivos do site
        run: |
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude dist/ --exclude .git/ --exclude .github/ \
            --exclude netlify/ --exclude supabase/ --exclude node_modules/ \
            --exclude package.json --exclude netlify.toml --exclude extract.py \
            --exclude data.js.bak
          ls dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
