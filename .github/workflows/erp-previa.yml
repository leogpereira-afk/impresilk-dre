name: Prévia do ERP (Mubisys)

# Puxa sozinho o mês corrente do Mubisys e grava a PRÉVIA (cfg.previaERP).
# NÃO escreve nos meses oficiais: esses continuam vindo do export .xlsx.
#
# Por que não usa a ação importarMes do servidor: ela só soma títulos que têm
# plano de contas, e receita OPERACIONAL nunca tem (no Mubisys a venda é
# classificada pela Ordem de Serviço, não pelo título). O importarMes reportava
# R$ 205 mil de receita quando o mês tinha R$ 460 mil. Aqui somamos por fora:
#   - despesa: 100% classificada por conta (o ERP entrega o plano de contas)
#   - receita: total correto, com a parte classificada destacada à parte
# Assim os TOTAIS ficam certos e fica explícito o quanto da receita ainda não
# tem quebra por produto (isso só sai depois de ler a OS).

on:
  schedule:
    - cron: '0 9 * * *'      # 06:00 em Brasília
  workflow_dispatch: {}

concurrency:
  group: erp-previa
  cancel-in-progress: true

jobs:
  previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache das Ordens de Serviço. Uma OS entregue não muda mais, então só as
      # OS novas do dia são buscadas — sem isto o robô refaz ~250 chamadas por
      # execução e o Mubisys responde devagar (segundos por OS).
      - name: Cache das Ordens de Serviço
        uses: actions/cache@v4
        with:
          path: .cache
          key: os-cache-${{ github.run_id }}
          restore-keys: os-cache-

      - name: Ler o mês corrente do ERP e gravar a prévia
        env:
          TZ: America/Sao_Paulo
        run: python3 scripts/erp_previa.py
