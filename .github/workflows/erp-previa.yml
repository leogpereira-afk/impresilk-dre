name: DRE do ERP (Mubisys)
on:
  schedule:
    - cron: '0 9,15,21 * * *'
  workflow_dispatch:
    inputs:
      mes:
        description: 'Mês opcional (AAAA-MM); vazio revisa anterior e atual'
        type: string
        default: ''
      publicar:
        description: 'Gravar os meses ERP após os controles (planilhas preservadas)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: erp-previa
  cancel-in-progress: false
jobs:
  previa:
    # Ativar somente após credencial e coleta em simulação conferidas.
    if: github.event_name == 'workflow_dispatch' || vars.DRE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validar cálculos antes da coleta
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Atualizar os períodos com proteção de concorrência
        env:
          TZ: America/Sao_Paulo
          DRE_MACHINE_TOKEN: ${{ secrets.DRE_MACHINE_TOKEN }}
          DRE_PUBLISH: ${{ github.event_name == 'schedule' && '1' || inputs.publicar && '1' || '0' }}
          DRE_MES: ${{ inputs.mes }}
        run: |
          if [ -n "$DRE_MES" ]; then
            python3 scripts/erp_previa.py "$DRE_MES"
          else
            python3 scripts/erp_previa.py
          fi
