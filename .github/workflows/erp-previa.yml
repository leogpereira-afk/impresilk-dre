name: DRE do ERP (Mubisys)

# Lê o mês corrente do Mubisys e grava o MÊS OFICIAL do painel (a planilha
# .xlsx foi aposentada em 01/08/2026) + a prévia com diagnóstico
# (cfg.previaERP: totais por dia, por empresa, pendências de classificação).
#
# Proteções que vivem no scripts/erp_previa.py — não remover sem ler lá:
#   * mês sem lançamento NÃO vira registro (o dia 1º de madrugada gravava um
#     mês vazio e o painel abria zerado);
#   * mês com origem "planilha" nunca é reescrito sem --forcar;
#   * a parcela do Banco do Nordeste é separada pela descrição em
#     máquinas/veículo/capital de giro — sem isso R$ 23 mil/mês caem em
#     "Custos da Operação".
#
# Por que não usa a ação importarMes do servidor: ela só soma títulos que têm
# plano de contas, e receita OPERACIONAL nunca tem (no Mubisys a venda é
# classificada pela Ordem de Serviço, não pelo título). A receita por produto
# sai do rateio do valor recebido entre os itens da OS.

on:
  schedule:
    # 3x ao dia: o painel acompanha o mês em andamento sem esperar amanhã.
    # Até o dia 7 cada rodada também reconsolida o mês anterior (retroativos).
    - cron: '0 9,15,21 * * *'   # 06:00, 12:00 e 18:00 em Brasília
  workflow_dispatch: {}

concurrency:
  group: erp-previa
  cancel-in-progress: true

jobs:
  previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache das Ordens de Serviço. Uma OS entregue não muda mais, então só as
      # OS novas do dia são buscadas — sem isto o robô refaz ~250 chamadas por
      # execução e o Mubisys responde devagar (segundos por OS).
      - name: Cache das Ordens de Serviço
        uses: actions/cache@v4
        with:
          path: .cache
          key: os-cache-${{ github.run_id }}
          restore-keys: os-cache-

      - name: Ler o mês corrente do ERP e gravar o mês oficial + prévia
        env:
          TZ: America/Sao_Paulo
        run: python3 scripts/erp_previa.py
